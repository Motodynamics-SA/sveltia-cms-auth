# Plain-text configuration. GITHUB_CLIENT_SECRET is NOT here: it is a Cloudflare
# Secret set in the dashboard (Settings → Variables and Secrets), which a deploy
# leaves untouched. Anything listed here is what a deploy from this repo sets;
# a variable that exists only in the dashboard would be removed on the next deploy.
[vars]
GITHUB_CLIENT_ID = "Ov23liHvkaJlD5dQIVOy"
