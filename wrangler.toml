# www.motodynamics.gr); the review URL stays allowed until it is retired.
ALLOWED_DOMAINS = "dev.motodynamics.gr,www.motodynamics.gr,motodynamics.gr,motodynamicsgr.summer-queen-432f.workers.dev"
